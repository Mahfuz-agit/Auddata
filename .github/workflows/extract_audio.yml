name: Extract Audio Data

on:
  workflow_dispatch:
    inputs:
      media_file:
        description: "Path to video or audio file in repo"
        required: true
        default: "input/video.mp4"

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run extraction script
        run: python scripts/extract_audio_data.py "${{ github.event.inputs.media_file }}" audio_data.json

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: audio-data
          path: audio_data.json
